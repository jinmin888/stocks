[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screener"
version = "0.1.0"
description = "Multi-market stock/crypto screener: fractals (顶底分型) and RSI divergence"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "pydantic>=2.0", "pyyaml>=6", "pyarrow>=14",
    "ccxt>=4.4", "yfinance>=0.2.50", "akshare>=1.15", "pykrx>=1.0", "lxml>=5", "requests>=2.31",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlmodel>=0.0.22", "apscheduler>=3.10,<4",
          "itsdangerous>=2.1"]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["screener", "screener.data", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
